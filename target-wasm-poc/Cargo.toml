[package]
name = "neo3-wasm-poc"
version = "0.1.0"
edition = "2021"
description = "Proof-of-Concept WASM target for Neo Rust SDK"
authors = ["R3E Network <jimmy@r3e.network> (c) 2020-2026"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "console", "HtmlDocument"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
tokio = { version = "1.45", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "wasm-js"] }
p256 = { version = "0.13", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa", "std"] }
sha2 = { version = "0.11", default-features = false, features = ["std"] }
sha3 = { version = "0.10", default-features = false, features = ["std"] }
blake2 = { version = "0.10", default-features = false, features = ["std"] }
ripemd = "0.2"
bs58 = "0.5"
base64 = "0.22"
hex = { package = "const-hex", version = "1.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
once_cell = "1.21"
rand = "0.9"
rand_core = "0.9"
ws_stream_wasm = "0.7"
futures-timer = "3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[bin]]
name = "neo-wasm-demo"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
