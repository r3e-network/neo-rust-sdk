# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# Version 2 configuration removes deprecated fields and sets new defaults
version = 2

# Note: vulnerability, unsound, and notice are no longer configurable in newer versions
# They always emit errors and can only be ignored via the ignore field
unmaintained = "workspace"
yanked = "deny"

# Temporarily ignored advisories (no upstream fix available)
ignore = [
    # RUSTSEC-2023-0071: rsa crate Marvin Attack timing sidechannel.
    # jsonwebtoken's RustCrypto provider enables rsa 0.9.x, but the SDK only exposes HS256.
    # No patched rsa 0.9.x version exists yet.
    # Tracked: https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
    
    # RUSTSEC-2024-0436: `paste` unmaintained. Compile-time-only proc-macro pulled
    # transitively by alloy-primitives (Neo X EVM bridge). No runtime exposure.
    # Remove once alloy-primitives drops the paste dependency.
    # Tracked: https://rustsec.org/advisories/RUSTSEC-2024-0436
    "RUSTSEC-2024-0436",
]

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "deny"
highlight = "all"
# List of crates to deny
deny = [
    # Each entry the name of a crate and a version range. If version is
    # not specified, all versions will be matched.
    #{ name = "ansi_term", version = "=0.11.0" },
]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = []
# Similarly to `skip` allows you to skip certain crates during duplicate
# detection. Unlike skip, it also includes the entire tree of transitive
# dependencies starting at the specified crate, up to a certain depth, which is
# by default infinite
skip-tree = []

[licenses]
# Note: vulnerability, unsound, and notice are no longer configurable in newer versions
# They always emit errors and can only be ignored via the ignore field

# Version 2 configuration removes deprecated fields and sets new defaults
version = 2

confidence-threshold = 0.9
# copyleft = "deny"

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.7 short identifier (+ optional exception)].
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # https://github.com/briansmith/webpki/issues/148
    "LicenseRef-webpki",
]

# Allow 1 or more licenses on a per-crate basis, so that particular licenses
# aren't accepted for every possible crate as with the normal allow list
exceptions = [
    # root certificate bundles used by rustls/reqwest
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-root-certs" },
]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "LicenseRef-webpki"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[[licenses.clarify]]
name = "rustls-webpki"
expression = "LicenseRef-webpki"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "deny"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "deny"
