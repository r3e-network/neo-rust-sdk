# Grafana Tempo configuration for the Neo Rust SDK.
#
# Tempo is an alternative (or complement) to Jaeger for storing the OTLP traces
# emitted by the SDK when built with `--features metrics-otlp`. Point the SDK's
# OTLP exporter at the OpenTelemetry Collector (recommended) or directly at
# Tempo's OTLP receiver below.
#
# Enable in the stack by adding a `tempo` service to monitoring/docker-compose.yml:
#
#   tempo:
#     image: grafana/tempo:latest
#     command: ["-config.file=/etc/tempo/tempo-config.yml"]
#     volumes:
#       - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yml
#     ports:
#       - "3200:3200"   # Tempo query / API
#       - "4317"        # OTLP gRPC (internal)
#
# Then add the OTLP endpoint to the SDK environment:
#
#   NEO_TRACING_ENABLED=true
#   NEO_TRACING_ENDPOINT=http://otel-collector:4317   # or http://tempo:4317
#   # OpenTelemetry-standard fallback also honored by the SDK:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Generate service-graph and span metrics that Prometheus can scrape, so RPC
# latency histograms recorded via the SDK correlate with distributed traces.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
