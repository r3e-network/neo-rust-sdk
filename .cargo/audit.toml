# Cargo audit configuration

[advisories]
ignore = [
    # RUSTSEC-2026-0387 - timing variability in `crypto-bigint` ops. The patched
    # line is 0.7.x. The SDK's own crypto stack now uses elliptic-curve 0.14 /
    # p256 0.14 / k256 0.14 (crypto-bigint 0.7), but crypto-bigint 0.5.5 is
    # still reached through third-party dependencies that have not migrated to
    # the RustCrypto 0.14 line yet:
    #   - alloy 2.x (EVM layer) via k256 0.13 / elliptic-curve 0.13
    #   - yubihsm 0.42 (HSM feature) via p256 0.13 / elliptic-curve 0.13
    # Both fixes are upstream-blocked: yubihsm's main branch already migrated
    # (awaiting a 0.43 release), alloy has no 0.14-based release yet.
    # Remove once both upstream dependencies ship their migrations.
    "RUSTSEC-2026-0387",
]
